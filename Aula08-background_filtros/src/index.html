<!DOCTYPE html>
<html lang="pt">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Background</title>
     <link rel="stylesheet" href="output.css">
</head>
<body class="m-8 h-[2000px]">
      <h1 class="text-xl font-bold">Olá Mundo.</h1>
      <!-- Background -->
      <!-- bg-[url('img/padrao.svg')] - valor arbitrário para usar imagens -->
      <!-- <div class="h-96 bg-[url('./img/padrao.svg')]"></div> -->
      <!-- <div class="h-96 bg-[url('./img/padrao.svg')]"></div> -->
      <!-- Propriedades -->
      <!-- bg-cover / contain - background-size -->
      <!-- bg-no-repeat - background-repeat -->
      <!-- bg-center / top / right / left - background-position -->
      <!-- bg-fixed / scroll - background-attachment -->
       <div class="p-12 pt-60 bg-[url('./img/floresta.jpg')] bg-cover bg-center bg-fixed rounded-2xl">
          <h1 class="text-4xl/tight text-white font-serif font-bolt text-balance mb-16 max-w-screen-sm"> venha experimentar a vida na floresta</h1>
          <p class="text-white">Melhores locais para visitar</p>
          <a href="/" class="underline underline-offset-4 decoration">2049</a>
       </div>
       <h1
  class="text-4xl/tight bg-clip-text text-transparent bg-[url('img/floresta.jpg')] font-serif font-bold text-balance"
>
  Venha Experimentar a Vida na Floresta
</h1>
<img src="img/floresta.jpg" alt="" class="grayscale hover:grayscale-0"/> 
<!-- grayscale-0 quando passar o mouse por cima fica na cor natural -->
<img src="img/floresta.jpg" alt="" class="contrast-125"/>
<img src="img/floresta.jpg" alt="" class="blur-md"/>
<!-- Fica embasado a img -->
<img src="./img/floresta.jpg" alt="" class="sepia" />

<!-- BackDrop -->
<!-- Os mesmos filtros podem também ser aplicados aos elementos do fundo apenas. Lembrando que para ver os elementos do fundo, é necessário que o elemento no topo possua uma certa transparência. -->
<nav
  class="bg-white backdrop-sepia absolute top-20 left-20 p-4 w-40 rounded-md backdrop-blur-md"
>
  <a href="">Home</a>
  <ul>
    <li>Produtos</li>
    <li>Sobre</li>
    <li>Contato</li>
  </ul>
</nav>
<img src="img/floresta.jpg" alt="" class="">

</body>
</html>
